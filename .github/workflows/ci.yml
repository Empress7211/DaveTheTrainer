name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Swift Tests
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Test native Steam signing and recovery
        run: python3 -m unittest discover -s script/tests -v

      - name: Run tests
        run: >
          swift test
          --skip InstalledGameIntegrationTests
          --skip Il2CppFeatureLocatorTests
          --skip MachOModuleResolverTests
